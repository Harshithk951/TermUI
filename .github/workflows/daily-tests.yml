name: Daily Test Automation

on:
  workflow_dispatch:

jobs:
  run-automation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Git Configuration
        run: |
          git config --global user.name "Harshithk951"
          git config --global user.email "harshithk951@users.noreply.github.com"
          git remote add upstream https://github.com/Karanjot786/TermUI.git || true

      - name: Run Test Scanner & Process Issues
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ secrets.NVIDIA_MODEL }}
        run: |
          TARGETS=$(bun run scripts/coverage-scanner.ts)
          FILE1=$(echo "$TARGETS" | jq -r '.[0].relativePath')
          FILE2=$(echo "$TARGETS" | jq -r '.[1].relativePath')
          PKG1=$(echo "$TARGETS" | jq -r '.[0].packageName')
          PKG2=$(echo "$TARGETS" | jq -r '.[1].packageName')

          echo "Target 1: $FILE1 ($PKG1)"
          echo "Target 2: $FILE2 ($PKG2)"

          for FILE in "$FILE1" "$FILE2"; do
            if [ "$FILE" = "null" ] || [ -z "$FILE" ]; then
              continue
            fi

            # Extract name and directory info
            DIR=$(dirname "$FILE")
            EXT="${FILE##*.}"
            NAME=$(basename "$FILE" ".$EXT")
            TEST_FILE="$DIR/$NAME.test.$EXT"
            BRANCH_NAME="test/auto-$(echo "$NAME" | tr '[:upper:]' '[:lower:]')"

            echo "=== Processing $FILE ==="

            if [ "$FILE" = "$FILE1" ]; then
              PKG="$PKG1"
            else
              PKG="$PKG2"
            fi

            # 1. Open Issue on Upstream
            ISSUE_TITLE="[bug] Unit Tests for $NAME in $FILE"
            ISSUE_BODY=$(cat <<EOF
<!-- Search existing issues first. Run on the latest version. -->

## Which package?

$PKG

## What happened?

The module \`$NAME\` in \`$FILE\` has 0% or low unit test coverage. Tests are needed to ensure high code quality, validation of functionality, and type checks.

## Proposed solution/Task

Create a unit test file for \`$NAME\` under the same package src directory. It should cover:
- Core functions and edge cases of the module.
- Normal and boundary parameters.
- Standard test validations.

## Environment

- Bun version: 1.3.14
- OS: Linux (GitHub Runner)
- Terminal emulator: -
- TermUI version: v0.1.x

## GSSoC contributor?

- [x] Yes. You contribute under GSSoC 2026.
- [ ] No.
EOF
)
            
            # Create the issue on upstream repository
            ISSUE_URL=$(gh issue create --repo Karanjot786/TermUI --title "$ISSUE_TITLE" --body "$ISSUE_BODY")
            ISSUE_NUMBER=$(echo "$ISSUE_URL" | grep -oE '[0-9]+$')
            echo "Created Issue #$ISSUE_NUMBER on upstream: $ISSUE_URL"

            # 2. Add GSSoC assignment comment
            gh issue comment "$ISSUE_NUMBER" --repo Karanjot786/TermUI --body "Please assign this issue to me for GSSoC 2026."

            # 3. Create branch and implement tests
            cp -r scripts /tmp/scripts
            git fetch upstream main
            git checkout -b "$BRANCH_NAME" upstream/main
            rm -rf scripts && cp -r /tmp/scripts scripts

            # Run Gemini test generator
            bun run scripts/generate-tests.ts "$FILE"

            # 4. Verify (Build, Typecheck, Test) with auto-fix loop
            MAX_ATTEMPTS=3
            ATTEMPT=1
            SUCCESS=false

            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Validation attempt $ATTEMPT..."
              
              # Run build, typecheck and vitest on the specific package/test
              BUILD_ERR=""
              bun run build || BUILD_ERR="Build failed"
              bun run typecheck || BUILD_ERR="$BUILD_ERR Typecheck failed"
              bun vitest run "$TEST_FILE" || BUILD_ERR="$BUILD_ERR Vitest run failed"

              if [ -z "$BUILD_ERR" ]; then
                SUCCESS=true
                break
              else
                echo "Validation failed: $BUILD_ERR"
                if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                  echo "Attempting to auto-fix using AI..."
                  bun run scripts/generate-tests.ts "$FILE" --fix "$BUILD_ERR"
                fi
              fi
              ATTEMPT=$((ATTEMPT + 1))
            done

            if [ "$SUCCESS" = "true" ]; then
              echo "Validation succeeded! Committing and pushing..."
              git add "$TEST_FILE"
              git commit -m "test: add unit tests for $NAME"
              git push origin "$BRANCH_NAME" --force

              # 5. Open PR on Upstream
              PR_TITLE="test: add unit tests for $NAME"
              PR_BODY=$(cat <<EOF
## Description

This PR adds comprehensive unit test coverage for the \`$NAME\` module under package \`$PKG\`.

## Related Issue

Closes #$ISSUE_NUMBER

## Which package(s)?

$PKG

## Type of Change

- [ ] 🐛 Bug fix (\`type:bug\`)
- [ ] ✨ Feature (\`type:feature\`)
- [ ] 📝 Docs (\`type:docs\`)
- [x] 🧪 Tests (\`type:testing\`)
- [ ] ♻️ Refactor (\`type:refactor\`)
- [ ] 🎨 Design / UX (\`type:design\`)
- [ ] ♿ Accessibility (\`type:accessibility\`)
- [ ] ⚡ Performance (\`type:performance\`)
- [ ] 🔧 DevOps / CI (\`type:devops\`)
- [ ] 🔒 Security (\`type:security\`)

## Checklist

- [x] ⭐ You starred the repo. The \`needs-star\` check blocks your merge otherwise.
- [x] Tests pass locally: \`bun vitest run\`
- [x] Build passes: \`bun run build\`
- [x] Typecheck passes: \`bun run typecheck\`
- [x] You read [\`CONTRIBUTING.md\`](./CONTRIBUTING.md).
- [x] Your PR title follows \`type: short description\`.
- [x] Widget state mutators call \`markDirty()\` (if your change affects rendering).
- [x] No new \`any\` types without an inline comment explaining why.
- [x] No unrelated refactors bundled into this PR.

## GSSoC 2026 Participation

- [x] You are a GSSoC 2026 contributor.
- Your GSSoC profile: \`https://gssoc.girlscript.org/profile/Harshithk951\`

## Screenshots / Recordings (UI changes)

N/A

## Notes for the Reviewer

None
EOF
)
              
              gh pr create --repo Karanjot786/TermUI --title "$PR_TITLE" --body "$PR_BODY" --head "Harshithk951:$BRANCH_NAME" --base main
            else
              echo "Failed to generate valid test suite for $FILE after $MAX_ATTEMPTS attempts."
            fi
          done
